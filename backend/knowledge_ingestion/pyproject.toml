[project]
name = "materials-knowledge-ingestion"
version = "0.1.0"
description = "Isolated evidence-grounded ingestion service for native local archival"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "httpx>=0.27,<1",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1",
  "pyyaml>=6,<7", "openpyxl>=3.1,<4", "xlrd>=2,<3", "pymupdf>=1.24,<2"
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff==0.15.12", "mypy==1.18.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kb_ingest"]
force-include = { "runtime/mineru" = "runtime/mineru", "runtime/handwriting" = "runtime/handwriting" }

[tool.hatch.build]
exclude = ["config.local.toml", ".env", ".env.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
required-version = "==0.15.12"
target-version = "py312"
line-length = 120

[tool.ruff.per-file-target-version]
"**/materials-knowledge-mcp/**/*.py" = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PTH", "G", "LOG", "T20", "BLE", "TRY", "DTZ", "ASYNC", "S", "C901"]

[tool.ruff.lint.per-file-ignores]
# Assertions are the executable contract of pytest, including shared fixture helpers.
"**/tests/**" = ["S101"]
